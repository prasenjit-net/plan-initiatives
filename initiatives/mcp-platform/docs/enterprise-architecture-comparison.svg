  <rect x="80"  y="786" width="12" height="12" rx="2" fill="#6C3483"/>
  <text x="98"  y="796" font-size="11" fill="#8AAFC8">SaaS</text>
  <rect x="146" y="786" width="12" height="12" rx="2" fill="#A04000"/>
  <text x="164" y="796" font-size="11" fill="#8AAFC8">Google Apigee</text>
  <rect x="274" y="786" width="12" height="12" rx="2" fill="#2471A3"/>
  <text x="292" y="796" font-size="11" fill="#8AAFC8">OCP Services</text>
  <rect x="390" y="786" width="12" height="12" rx="2" fill="#1A2B4A"/>
  <text x="408" y="796" font-size="11" fill="#8AAFC8">Systems of Record</text>
  <rect x="546" y="786" width="12" height="12" rx="2" fill="#1E8449"/>
  <text x="564" y="796" font-size="11" fill="#8AAFC8">New — MCP Platform</text>
  <rect x="702" y="786" width="12" height="12" rx="2" fill="#138D75"/>

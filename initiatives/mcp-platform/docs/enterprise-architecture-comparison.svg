<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" width="1240" height="810"
     font-family="'Segoe UI', Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2471A3"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1E8449"/>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#138D75"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  BACKGROUND                                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect width="1240" height="810" fill="#E8EDF4"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  TITLE BAR                                                     -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect width="1240" height="64" fill="#1B2B45"/>
  <text x="620" y="27" text-anchor="middle" font-size="20" font-weight="bold" fill="white">
    MCP Platform Initiative — Enterprise Architecture Comparison
  </text>
  <text x="620" y="50" text-anchor="middle" font-size="12" fill="#8AAFC8">
    Current State  vs  Target State  ·  Manager Overview
  </text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  LEFT PANEL — CURRENT STATE                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="12" y="68" width="596" height="706" rx="8" fill="white" filter="url(#shadow)"/>
  <!-- Header -->
  <rect x="12" y="68" width="596" height="36" rx="8" fill="#C0392B"/>
  <rect x="12" y="92"  width="596" height="12" fill="#C0392B"/>
  <text x="310" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="white">CURRENT STATE</text>

  <!-- L: External Clients -->
  <rect x="197" y="124" width="226" height="46" rx="6" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="310" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="white">External Clients</text>
  <text x="310" y="161" text-anchor="middle" font-size="10" fill="#AAB7C4">Browsers · Mobile · Third-party APIs</text>

  <!-- L: arrow Clients → VFD -->
  <line x1="310" y1="170" x2="310" y2="202" stroke="#777" stroke-width="2" marker-end="url(#arr)"/>
  <text x="318" y="190" font-size="10" fill="#888">HTTPS</text>

  <!-- L: VFD -->
  <rect x="172" y="202" width="276" height="50" rx="6" fill="#6C3483" filter="url(#shadow)"/>
  <text x="310" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VFD — Virtual Front Door</text>
  <text x="310" y="240" text-anchor="middle" font-size="10" fill="#D7BDE2">SaaS · TLS · WAF · CDN · DDoS Protection</text>

  <!-- L: arrow VFD → Apigee -->
  <line x1="310" y1="252" x2="310" y2="284" stroke="#777" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L: Apigee -->
  <rect x="172" y="284" width="276" height="50" rx="6" fill="#A04000" filter="url(#shadow)"/>
  <text x="310" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Apigee  (APG)</text>
  <text x="310" y="322" text-anchor="middle" font-size="10" fill="#FAD7A0">Google API Gateway · Auth · Path-prefix Routing</text>

  <!-- L: fan from Apigee to 3 OCP services -->
  <line x1="310" y1="334" x2="310" y2="362" stroke="#2471A3" stroke-width="2"/>
  <line x1="120" y1="362" x2="500" y2="362" stroke="#2471A3" stroke-width="2"/>
  <line x1="120" y1="362" x2="120" y2="396" stroke="#2471A3" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="310" y1="362" x2="310" y2="396" stroke="#2471A3" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="500" y1="362" x2="500" y2="396" stroke="#2471A3" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="310" y="352" text-anchor="middle" font-size="9" fill="#2471A3" font-style="italic">path-prefix routing</text>

  <!-- L: OCP container -->
  <rect x="34" y="396" width="554" height="106" rx="6" fill="#EBF5FB" stroke="#2471A3" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="580" y="408" text-anchor="end" font-size="9" fill="#2471A3" font-style="italic">OCP (OpenShift Container Platform)</text>

  <!-- L: Service A -->
  <rect x="52"  y="414" width="136" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="120" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Backend Svc A</text>
  <text x="120" y="449" text-anchor="middle" font-size="9"  fill="#D6EAF8">REST / HTTP</text>

  <!-- L: Service B -->
  <rect x="242" y="414" width="136" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="310" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Backend Svc B</text>
  <text x="310" y="449" text-anchor="middle" font-size="9"  fill="#D6EAF8">REST / HTTP</text>

  <!-- L: Service C -->
  <rect x="432" y="414" width="136" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="500" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Backend Svc C</text>
  <text x="500" y="449" text-anchor="middle" font-size="9"  fill="#D6EAF8">REST / HTTP</text>

  <!-- L: merge OCP services → SOR -->
  <line x1="120" y1="458" x2="120" y2="524" stroke="#777" stroke-width="1.5"/>
  <line x1="310" y1="458" x2="310" y2="524" stroke="#777" stroke-width="1.5"/>
  <line x1="500" y1="458" x2="500" y2="524" stroke="#777" stroke-width="1.5"/>
  <line x1="120" y1="524" x2="500" y2="524" stroke="#777" stroke-width="1.5"/>
  <line x1="310" y1="524" x2="310" y2="542" stroke="#777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- L: SOR -->
  <rect x="155" y="542" width="310" height="50" rx="6" fill="#1A2B4A" filter="url(#shadow)"/>
  <text x="310" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Systems of Record  (SOR)</text>
  <text x="310" y="580" text-anchor="middle" font-size="10" fill="#7FB3D3">Databases · Mainframes · ERP · Partner APIs</text>

  <!-- L: Pain point callout -->
  <rect x="34" y="614" width="554" height="72" rx="6" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="44" y="634" font-size="12" font-weight="bold" fill="#C0392B">⚠  Pain Points (before MCP Platform)</text>
  <text x="44" y="653" font-size="11" fill="#641E16">•  No standardized interface for AI agents to discover or invoke tools</text>
  <text x="44" y="671" font-size="11" fill="#641E16">•  Each service requires bespoke integration — no aggregation layer</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  RIGHT PANEL — TARGET STATE                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <rect x="632" y="68" width="596" height="706" rx="8" fill="white" filter="url(#shadow)"/>
  <!-- Header -->
  <rect x="632" y="68" width="596" height="36" rx="8" fill="#1E8449"/>
  <rect x="632" y="92"  width="596" height="12" fill="#1E8449"/>
  <text x="930" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="white">TARGET STATE  (after MCP Platform Initiative)</text>

  <!-- R: External Clients -->
  <rect x="726" y="124" width="190" height="46" rx="6" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="821" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="white">External Clients</text>
  <text x="821" y="161" text-anchor="middle" font-size="10" fill="#AAB7C4">Browsers · Mobile · Third-party</text>

  <!-- R: Dev Portal (NEW) -->
  <rect x="1038" y="124" width="168" height="46" rx="6" fill="#138D75" filter="url(#shadow)"/>
  <text x="1122" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Dev Portal</text>
  <text x="1122" y="161" text-anchor="middle" font-size="10" fill="#A9DFBF">In-house · Internal Only</text>
  <!-- NEW badge -->
  <rect x="1038" y="110" width="40" height="18" rx="4" fill="#E74C3C"/>
  <text x="1058" y="123" text-anchor="middle" font-size="9" font-weight="bold" fill="white">NEW</text>

  <!-- R: arrow Clients → VFD -->
  <line x1="821" y1="170" x2="821" y2="202" stroke="#777" stroke-width="2" marker-end="url(#arr)"/>
  <text x="829" y="190" font-size="10" fill="#888">HTTPS</text>

  <!-- R: VFD (unchanged) -->
  <rect x="701" y="202" width="240" height="50" rx="6" fill="#6C3483" filter="url(#shadow)"/>
  <text x="821" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VFD — Virtual Front Door</text>
  <text x="821" y="240" text-anchor="middle" font-size="10" fill="#D7BDE2">SaaS · TLS · WAF · CDN  (unchanged)</text>

  <!-- R: arrow VFD → Apigee -->
  <line x1="821" y1="252" x2="821" y2="284" stroke="#777" stroke-width="2" marker-end="url(#arr)"/>

  <!-- R: Apigee (plus new /mcp/* rule) -->
  <rect x="701" y="284" width="240" height="50" rx="6" fill="#A04000" filter="url(#shadow)"/>
  <text x="821" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Apigee  (APG)</text>
  <text x="821" y="322" text-anchor="middle" font-size="10" fill="#FAD7A0">+ /mcp/* → MCP Gateway  (new rule only)</text>

  <!-- R: Dev Portal bypass arrow (dashed, long diagonal) -->
  <path d="M 1122,170 Q 1122,310 1068,393"
        fill="none" stroke="#138D75" stroke-width="2.5" stroke-dasharray="8,4"
        marker-end="url(#arr-teal)"/>
  <!-- bypass label, positioned beside the curve -->
  <text x="1138" y="258" font-size="10" fill="#138D75" font-style="italic">direct /</text>
  <text x="1138" y="272" font-size="10" fill="#138D75" font-style="italic">internal</text>
  <text x="1138" y="286" font-size="10" fill="#0E6655" font-style="italic">(bypasses VFD</text>
  <text x="1138" y="299" font-size="10" fill="#0E6655" font-style="italic"> &amp; Apigee)</text>

  <!-- R: Apigee → MCP Gateway arrow -->
  <line x1="821" y1="334" x2="856" y2="393" stroke="#1E8449" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="790" y="372" font-size="9" fill="#1E8449" font-style="italic">/mcp/* paths</text>

  <!-- R: MCP Gateway (NEW — primary new component) -->
  <rect x="766" y="393" width="302" height="56" rx="8" fill="#1E8449" stroke="#52BE80" stroke-width="2" filter="url(#shadow)"/>
  <text x="917" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="white">MCP Gateway</text>
  <text x="917" y="437" text-anchor="middle" font-size="10" fill="#ABEBC6">Router · Two-level LB · Circuit Breaker · Cache</text>
  <!-- NEW badge -->
  <rect x="766" y="379" width="46" height="20" rx="4" fill="#E74C3C"/>
  <text x="789" y="393" text-anchor="middle" font-size="10" font-weight="bold" fill="white">NEW</text>
  <!-- deployed on OCP badge -->
  <rect x="948" y="379" width="120" height="20" rx="4" fill="#2471A3"/>
  <text x="1008" y="393" text-anchor="middle" font-size="9" fill="white">deployed on OCP</text>

  <!-- R: fan MCP Gateway → 3 OCP services -->
  <line x1="917" y1="449" x2="917" y2="474" stroke="#1E8449" stroke-width="2"/>
  <line x1="758" y1="474" x2="1076" y2="474" stroke="#1E8449" stroke-width="2"/>
  <line x1="758"  y1="474" x2="758"  y2="510" stroke="#1E8449" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="917"  y1="474" x2="917"  y2="510" stroke="#1E8449" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="1076" y1="474" x2="1076" y2="510" stroke="#1E8449" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- R: OCP container -->
  <rect x="648" y="492" width="556" height="102" rx="6" fill="#EBF5FB" stroke="#2471A3" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="1196" y="504" text-anchor="end" font-size="9" fill="#2471A3" font-style="italic">OCP (OpenShift Container Platform)</text>

  <!-- R: MCP Server -->
  <rect x="666"  y="510" width="152" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="742"  y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="white">MCP Server</text>
  <text x="742"  y="546" text-anchor="middle" font-size="9" fill="#D6EAF8">MCP Protocol</text>

  <!-- R: REST API Svc -->
  <rect x="841"  y="510" width="152" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="917"  y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="white">REST API Svc</text>
  <text x="917"  y="546" text-anchor="middle" font-size="9" fill="#D6EAF8">via REST Adapter</text>

  <!-- R: gRPC Svc -->
  <rect x="1016" y="510" width="152" height="44" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="1092" y="528" text-anchor="middle" font-size="11" font-weight="bold" fill="white">gRPC Service</text>
  <text x="1092" y="546" text-anchor="middle" font-size="9" fill="#D6EAF8">via gRPC Adapter</text>

  <!-- R: merge OCP services → SOR -->
  <line x1="742"  y1="554" x2="742"  y2="610" stroke="#777" stroke-width="1.5"/>
  <line x1="917"  y1="554" x2="917"  y2="610" stroke="#777" stroke-width="1.5"/>
  <line x1="1092" y1="554" x2="1092" y2="610" stroke="#777" stroke-width="1.5"/>
  <line x1="742"  y1="610" x2="1092" y2="610" stroke="#777" stroke-width="1.5"/>
  <line x1="917"  y1="610" x2="917"  y2="628" stroke="#777" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- R: SOR (unchanged) -->
  <rect x="767" y="628" width="300" height="50" rx="6" fill="#1A2B4A" filter="url(#shadow)"/>
  <text x="917" y="648" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Systems of Record  (SOR)</text>
  <text x="917" y="666" text-anchor="middle" font-size="10" fill="#7FB3D3">Databases · Mainframes · ERP  (unchanged)</text>

  <!-- R: Benefits callout -->
  <rect x="648" y="698" width="556" height="62" rx="6" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
  <text x="660" y="718" font-size="12" font-weight="bold" fill="#1E8449">✓  MCP Gateway delivers</text>
  <text x="660" y="737" font-size="11" fill="#186A3B">•  Unified MCP interface for all AI agents · Two-level load balancing</text>
  <text x="660" y="753" font-size="11" fill="#186A3B">•  Protocol abstraction (REST / gRPC → MCP) · Session management</text>


<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800"
     font-family="'Segoe UI', Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#444"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#1E8449"/>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#0E6655"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- ── Background ───────────────────────────────────────────────────── -->
  <rect width="960" height="800" fill="#EEF2F7"/>

  <!-- ── Title bar ────────────────────────────────────────────────────── -->
  <rect width="960" height="60" fill="#1B2B45"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="white">
    MCP Platform Initiative — Enterprise Architecture &amp; Deployment
  </text>
  <text x="480" y="47" text-anchor="middle" font-size="11" fill="#8AAFC8">
    Full deployment topology · Components marked  NEW  are introduced by this initiative
  </text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  COLUMN A  — Ingress chain (left side)                            -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- External Clients -->
  <rect x="60" y="82" width="212" height="50" rx="6" fill="#2C3E50" filter="url(#shadow)"/>
  <text x="166" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="white">External Clients</text>
  <text x="166" y="121" text-anchor="middle" font-size="10" fill="#AEB6BF">Browsers · Mobile · 3rd-party</text>

  <!-- Clients → VFD arrow -->
  <line x1="166" y1="132" x2="166" y2="168" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="174" y="155" font-size="10" fill="#777">HTTPS</text>

  <!-- VFD -->
  <rect x="60" y="168" width="212" height="50" rx="6" fill="#6C3483" filter="url(#shadow)"/>
  <text x="166" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="white">VFD — Virtual Front Door</text>
  <text x="166" y="207" text-anchor="middle" font-size="10" fill="#D7BDE2">SaaS · TLS · WAF · CDN · DDoS</text>

  <!-- VFD → Apigee arrow -->
  <line x1="166" y1="218" x2="166" y2="254" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Apigee -->
  <rect x="60" y="254" width="212" height="50" rx="6" fill="#922B21" filter="url(#shadow)"/>
  <text x="166" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Apigee</text>
  <text x="166" y="293" text-anchor="middle" font-size="10" fill="#FAD7A0">Google API Gateway · Auth · Rate Limit</text>

  <!-- Apigee → Existing services arrow (straight down) -->
  <line x1="166" y1="304" x2="166" y2="370" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="100" y="322" font-size="9" fill="#777">path-prefix</text>
  <text x="102" y="334" font-size="9" fill="#777">routing</text>
  <text x="98" y="346" font-size="9" fill="#777">(existing)</text>

  <!-- Apigee → MCP Gateway arrow (new /mcp/* rule) -->
  <!-- goes right from Apigee center to MCP Gateway left edge -->
  <line x1="272" y1="279" x2="430" y2="279" stroke="#1E8449" stroke-width="2.2" stroke-dasharray="0" marker-end="url(#arr-green)"/>
  <!-- NEW badge on arrow -->
  <rect x="306" y="262" width="38" height="16" rx="3" fill="#E74C3C"/>
  <text x="325" y="274" text-anchor="middle" font-size="9" font-weight="bold" fill="white">NEW</text>
  <text x="325" y="258" text-anchor="middle" font-size="9" fill="#1E8449" font-style="italic">/mcp/* paths</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  OCP  Existing Backend Services  (left-bottom)                    -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="32" y="370" width="280" height="112" rx="6" fill="#EBF5FB" stroke="#2471A3" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="172" y="384" text-anchor="middle" font-size="9" fill="#2471A3" font-style="italic">OCP — OpenShift Container Platform</text>

  <!-- Svc A -->
  <rect x="44"  y="392" width="76" height="40" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="82"  y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Backend</text>
  <text x="82"  y="423" text-anchor="middle" font-size="10" fill="#D6EAF8">Svc A</text>

  <!-- Svc B -->
  <rect x="134" y="392" width="76" height="40" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="172" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Backend</text>
  <text x="172" y="423" text-anchor="middle" font-size="10" fill="#D6EAF8">Svc B</text>

  <!-- Svc C -->
  <rect x="224" y="392" width="76" height="40" rx="5" fill="#2471A3" filter="url(#shadow)"/>
  <text x="262" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Backend</text>
  <text x="262" y="423" text-anchor="middle" font-size="10" fill="#D6EAF8">Svc C</text>

  <!-- Existing services → SOR (single line from container bottom) -->
  <line x1="166" y1="482" x2="166" y2="560" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- MCP Gateway → Existing OCP Backend Services (via REST Adapter) -->
  <!-- From MCP Gateway bottom-left area (460, 326) → down to y=354 → left to x=312 → down to OCP box top (312,370) -->
  <polyline points="460,326 460,354 312,354 312,370"
            fill="none" stroke="#1E8449" stroke-width="2" stroke-dasharray="6,3"
            marker-end="url(#arr-green)"/>
  <text x="370" y="348" text-anchor="middle" font-size="9" fill="#1E8449" font-style="italic">via REST Adapter</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  COLUMN B  — Dev Portal (top right)  [NEW]                        -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="724" y="82" width="192" height="50" rx="6" fill="#0E6655" filter="url(#shadow)"/>
  <text x="820" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Dev Portal</text>
  <text x="820" y="121" text-anchor="middle" font-size="10" fill="#A2D9CE">In-house · Internal Network Only</text>
  <!-- NEW badge -->
  <rect x="724" y="68" width="40" height="18" rx="4" fill="#E74C3C"/>
  <text x="744" y="81" text-anchor="middle" font-size="9" font-weight="bold" fill="white">NEW</text>

  <!-- Dev Portal → MCP Gateway  (L-shape: down then left) -->
  <!-- From Dev Portal bottom center (820, 132) → down to y=266 → left to MCP GW right edge -->
  <!-- MCP Gateway right edge is at x=790 (430+360=790), we'll enter at (790, 279) -->
  <polyline points="820,132 820,279 790,279"
            fill="none" stroke="#0E6655" stroke-width="2.2" stroke-dasharray="8,4"
            marker-end="url(#arr-teal)"/>
  <text x="828" y="186" font-size="10" fill="#0E6655" font-style="italic">direct /</text>
  <text x="828" y="200" font-size="10" fill="#0E6655" font-style="italic">internal</text>
  <text x="826" y="214" font-size="9"  fill="#0E6655" font-style="italic">(bypasses</text>
  <text x="826" y="226" font-size="9"  fill="#0E6655" font-style="italic">VFD &amp; Apigee)</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  MCP GATEWAY  [NEW]                                               -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="430" y="254" width="360" height="72" rx="8" fill="#1E8449" stroke="#52BE80" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="610" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="white">MCP Gateway</text>
  <text x="610" y="305" text-anchor="middle" font-size="10" fill="#ABEBC6">Router · Two-level Load Balancer · Circuit Breaker · Response Cache</text>
  <!-- NEW badge -->
  <rect x="430" y="240" width="48" height="20" rx="4" fill="#E74C3C"/>
  <text x="454" y="254" text-anchor="middle" font-size="10" font-weight="bold" fill="white">NEW</text>
  <!-- OCP badge -->
  <rect x="660" y="240" width="130" height="20" rx="4" fill="#2471A3"/>
  <text x="725" y="254" text-anchor="middle" font-size="9" fill="white">deployed on OCP</text>

  <!-- MCP Gateway → MCP Downstream services (single arrow down) -->
  <line x1="610" y1="326" x2="610" y2="370" stroke="#1E8449" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  OCP  MCP Downstream Services  [NEW]                              -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="408" y="370" width="518" height="112" rx="6" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5" stroke-dasharray="7,3"/>
  <text x="667" y="384" text-anchor="middle" font-size="9" fill="#1E8449" font-style="italic">OCP — MCP Downstream Services  [NEW]</text>

  <!-- MCP-native Server -->
  <rect x="420" y="392" width="150" height="40" rx="5" fill="#1A7A4A" filter="url(#shadow)"/>
  <text x="495" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">MCP Server</text>
  <text x="495" y="423" text-anchor="middle" font-size="9" fill="#A9DFBF">MCP Protocol</text>

  <!-- REST API via adapter -->
  <rect x="585" y="392" width="150" height="40" rx="5" fill="#1A7A4A" filter="url(#shadow)"/>
  <text x="660" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">REST API Svc</text>
  <text x="660" y="423" text-anchor="middle" font-size="9" fill="#A9DFBF">via REST Adapter</text>

  <!-- gRPC via adapter -->
  <rect x="750" y="392" width="150" height="40" rx="5" fill="#1A7A4A" filter="url(#shadow)"/>
  <text x="825" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="white">gRPC Service</text>
  <text x="825" y="423" text-anchor="middle" font-size="9" fill="#A9DFBF">via gRPC Adapter</text>

  <!-- MCP downstream services → SOR -->
  <line x1="660" y1="482" x2="660" y2="560" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Merge / collector bar (both OCP groups → SOR)                    -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- horizontal connector between the two downward lines, just above SOR -->
  <line x1="166" y1="540" x2="660" y2="540" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  SYSTEMS OF RECORD  (unchanged)                                   -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="80" y="560" width="800" height="60" rx="6" fill="#1A2B4A" filter="url(#shadow)"/>
  <text x="480" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Systems of Record  (SOR)</text>
  <text x="480" y="606" text-anchor="middle" font-size="10" fill="#7FB3D3">Relational Databases · Mainframes · ERP Systems · Partner APIs  —  (unchanged)</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  GAINS CALLOUT                                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="36" y="646" width="888" height="88" rx="6" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
  <text x="52"  y="668" font-size="13" font-weight="bold" fill="#1E8449">✓  What the MCP Gateway adds to the enterprise</text>
  <text x="52"  y="690" font-size="11" fill="#186A3B">•  A single, standardised MCP interface for all AI agents — no bespoke per-service integration required</text>
  <text x="52"  y="708" font-size="11" fill="#186A3B">•  Routes to new MCP-native services AND existing OCP REST backends (via built-in REST Adapter) — no changes to existing services</text>
  <text x="52"  y="726" font-size="11" fill="#186A3B">•  Two-level load balancing (across services + across instances) · Circuit breaker · Session management · Response cache</text>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  LEGEND                                                            -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <rect x="0" y="752" width="960" height="48" fill="#1B2B45"/>
  <text x="14"  y="771" font-size="11" fill="#8AAFC8" font-weight="bold">Legend</text>

  <rect x="72"  y="762" width="13" height="13" rx="2" fill="#6C3483"/>
  <text x="91"  y="773" font-size="11" fill="#8AAFC8">VFD (SaaS)</text>

  <rect x="183" y="762" width="13" height="13" rx="2" fill="#922B21"/>
  <text x="202" y="773" font-size="11" fill="#8AAFC8">Apigee (Google)</text>

  <rect x="327" y="762" width="13" height="13" rx="2" fill="#2471A3"/>
  <text x="346" y="773" font-size="11" fill="#8AAFC8">OCP Services (existing)</text>

  <rect x="507" y="762" width="13" height="13" rx="2" fill="#1A2B4A"/>
  <text x="526" y="773" font-size="11" fill="#8AAFC8">Systems of Record</text>

  <rect x="668" y="762" width="13" height="13" rx="2" fill="#1E8449"/>
  <text x="687" y="773" font-size="11" fill="#8AAFC8">NEW — MCP Platform</text>

  <rect x="72"  y="785" width="13" height="13" rx="2" fill="#0E6655"/>
  <text x="91"  y="796" font-size="11" fill="#8AAFC8">NEW — Dev Portal (internal)</text>

  <line x1="283" y1="791" x2="316" y2="791" stroke="#0E6655" stroke-width="2.2" stroke-dasharray="7,4"/>
  <text x="323" y="796" font-size="11" fill="#8AAFC8">Bypass / internal route</text>

  <line x1="507" y1="791" x2="540" y2="791" stroke="#1E8449" stroke-width="2.2"/>
  <text x="547" y="796" font-size="11" fill="#8AAFC8">New routing path</text>

  <rect x="668" y="785" width="38" height="13" rx="3" fill="#E74C3C"/>
  <text x="687" y="796" text-anchor="middle" font-size="9" font-weight="bold" fill="white">NEW</text>
  <text x="712" y="796" font-size="11" fill="#8AAFC8"> = new component / route</text>

</svg>

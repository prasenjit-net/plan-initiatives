<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">MCP Platform - High Level Architecture Overview</title>
  <desc id="desc">Executive architecture overview showing AI agents, MCP Platform core, adapters, backend services, and operational capabilities.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123a63"/>
      <stop offset="100%" stop-color="#1f5f99"/>
    </linearGradient>

    <linearGradient id="routerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1fb"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8fd"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b2b3c" flood-opacity="0.15"/>
    </filter>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2267a8"/>
    </marker>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6f82"/>
    </marker>

    <style>
      .h1 { font: 700 34px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #ffffff; }
      .h2 { font: 700 20px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #13324d; }
      .h3 { font: 700 16px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #1c3f5f; }
      .body { font: 500 14px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #294766; }
      .small { font: 500 12px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #43627f; }
      .chip { font: 600 12px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #1c4c78; }
      .kpi { font: 700 18px 'Segoe UI', Tahoma, Arial, sans-serif; fill: #194972; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1540" height="96" rx="18" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="64" y="74" class="h1">MCP Platform - High Level Architecture Overview</text>
  <text x="64" y="101" class="body" fill="#d6e5f4">Consolidates MCP servers and REST APIs into a single, reliable interface for AI agents</text>

  <!-- Value Strip -->
  <rect x="30" y="136" width="1540" height="54" rx="12" fill="#dce9f7"/>
  <text x="56" y="170" class="h3">Business Outcome:</text>
  <text x="220" y="170" class="body">Faster initiative delivery, lower integration complexity, stronger governance, and production-grade reliability.</text>

  <!-- Left: AI Consumers -->
  <rect x="40" y="220" width="290" height="410" rx="16" fill="url(#cardGrad)" stroke="#b8d0e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="62" y="255" class="h2">AI Consumers</text>

  <rect x="62" y="275" width="246" height="74" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="78" y="305" class="h3">Agent Platforms</text>
  <text x="78" y="327" class="small">Internal copilots, workflow bots,</text>
  <text x="78" y="344" class="small">assistant applications</text>

  <rect x="62" y="365" width="246" height="74" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="78" y="395" class="h3">Enterprise Apps</text>
  <text x="78" y="417" class="small">Ticketing, analytics, and</text>
  <text x="78" y="434" class="small">domain-specific assistants</text>

  <rect x="62" y="455" width="246" height="74" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="78" y="485" class="h3">Developer Integrations</text>
  <text x="78" y="507" class="small">SDK clients and automation</text>
  <text x="78" y="524" class="small">pipelines</text>

  <text x="62" y="570" class="small">Protocol In:</text>
  <text x="133" y="570" class="chip">MCP / HTTP JSON</text>
  <text x="62" y="595" class="small">Session Context:</text>
  <text x="162" y="595" class="chip">Redis-backed</text>

  <!-- Center: Router -->
  <rect x="360" y="220" width="870" height="540" rx="20" fill="url(#routerGrad)" stroke="#7ea8d3" stroke-width="3" filter="url(#shadow)"/>
  <text x="392" y="258" class="h2">MCP Platform (Monolithic Core in Go)</text>

  <!-- Router rows -->
  <rect x="392" y="280" width="806" height="70" rx="12" fill="#ffffff" stroke="#c4d9ee"/>
  <text x="410" y="307" class="h3">Ingress and Control</text>
  <text x="410" y="329" class="body">HTTP Server | MCP Protocol Handler | Request Validation | Session Middleware</text>

  <rect x="392" y="365" width="806" height="92" rx="12" fill="#ffffff" stroke="#c4d9ee"/>
  <text x="410" y="393" class="h3">Routing Intelligence</text>
  <text x="410" y="415" class="body">Service Registry | Capability Catalog | Tool Resolution | Policy Enforcement</text>
  <text x="410" y="437" class="small">Chooses the best target service based on tool, health, and load-balancing strategy</text>

  <rect x="392" y="472" width="390" height="120" rx="12" fill="#ffffff" stroke="#c4d9ee"/>
  <text x="410" y="500" class="h3">Adapter Layer</text>
  <text x="410" y="522" class="body">MCP Adapter</text>
  <text x="410" y="542" class="body">REST Adapter (OpenAPI import)</text>
  <text x="410" y="562" class="small">Bidirectional message conversion</text>
  <text x="410" y="579" class="small">MCP &lt;-&gt; REST</text>

  <rect x="808" y="472" width="390" height="120" rx="12" fill="#ffffff" stroke="#c4d9ee"/>
  <text x="826" y="500" class="h3">Resilience and Performance</text>
  <text x="826" y="522" class="body">Load Balancer (round-robin/least-conn)</text>
  <text x="826" y="542" class="body">Health Checker + Retry/Failover</text>
  <text x="826" y="562" class="body">Rate Limiter (token bucket)</text>

  <rect x="392" y="607" width="806" height="130" rx="12" fill="#ffffff" stroke="#c4d9ee"/>
  <text x="410" y="635" class="h3">Observability and Operations</text>
  <text x="410" y="657" class="body">Structured Logging | OpenTelemetry Tracing | Metrics | Correlation IDs</text>
  <text x="410" y="679" class="small">Gives leadership visibility into adoption, latency, reliability, and service utilization</text>

  <!-- Right: Backends -->
  <rect x="1260" y="220" width="300" height="540" rx="16" fill="url(#cardGrad)" stroke="#b8d0e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1282" y="255" class="h2">Upstream Services</text>

  <rect x="1282" y="278" width="256" height="94" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="1298" y="306" class="h3">MCP Server Cluster A</text>
  <text x="1298" y="328" class="small">Tools, prompts, resources</text>
  <text x="1298" y="346" class="small">Multiple healthy instances</text>

  <rect x="1282" y="388" width="256" height="94" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="1298" y="416" class="h3">MCP Server Cluster B</text>
  <text x="1298" y="438" class="small">Domain-specific capabilities</text>
  <text x="1298" y="456" class="small">Independent scaling</text>

  <rect x="1282" y="498" width="256" height="94" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="1298" y="526" class="h3">REST API Ecosystem</text>
  <text x="1298" y="548" class="small">Imported via API specs</text>
  <text x="1298" y="566" class="small">Exposed as MCP tools</text>

  <rect x="1282" y="608" width="256" height="130" rx="12" fill="#f2f8ff" stroke="#b8d0e8"/>
  <text x="1298" y="636" class="h3">Shared Platform Services</text>
  <text x="1298" y="658" class="body">Redis Session Store</text>
  <text x="1298" y="678" class="body">Tracing Backend</text>
  <text x="1298" y="698" class="body">Log and Metrics Stack</text>
  <text x="1298" y="718" class="small">Operational analytics</text>

  <!-- Flow Arrows -->
  <path d="M 330 425 L 360 425" stroke="#2267a8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="276" y="412" class="small">Tool Calls</text>

  <path d="M 1230 500 L 1260 500" stroke="#2267a8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="1155" y="487" class="small">Routed Requests</text>

  <path d="M 1260 560 L 1230 560" stroke="#5c6f82" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGray)"/>
  <text x="1110" y="580" class="small">Responses + Metadata</text>

  <path d="M 360 480 L 330 480" stroke="#5c6f82" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGray)"/>
  <text x="230" y="501" class="small">Unified MCP Response</text>

  <!-- Bottom KPI cards -->
  <rect x="40" y="790" width="1520" height="160" rx="16" fill="#ffffff" stroke="#c4d9ee" filter="url(#shadow)"/>
  <text x="62" y="824" class="h2">Executive Highlights</text>

  <rect x="62" y="842" width="360" height="90" rx="12" fill="#f4f9ff" stroke="#c9dff4"/>
  <text x="82" y="870" class="kpi">Unified Access Layer</text>
  <text x="82" y="891" class="small">One integration point for all tools</text>
  <text x="82" y="910" class="small">across MCP and REST ecosystems.</text>

  <rect x="440" y="842" width="360" height="90" rx="12" fill="#f4f9ff" stroke="#c9dff4"/>
  <text x="460" y="870" class="kpi">Operational Excellence</text>
  <text x="460" y="891" class="small">Built-in rate limiting, tracing, and</text>
  <text x="460" y="910" class="small">health-driven failover.</text>

  <rect x="818" y="842" width="360" height="90" rx="12" fill="#f4f9ff" stroke="#c9dff4"/>
  <text x="838" y="870" class="kpi">Scalable by Design</text>
  <text x="838" y="891" class="small">Supports multi-instance backends and</text>
  <text x="838" y="910" class="small">stateless horizontal router scaling.</text>

  <rect x="1196" y="842" width="342" height="90" rx="12" fill="#f4f9ff" stroke="#c9dff4"/>
  <text x="1216" y="870" class="kpi">Governed Growth</text>
  <text x="1216" y="891" class="small">Standardized policies and visibility</text>
  <text x="1216" y="910" class="small">for future initiative expansion.</text>
</svg>
